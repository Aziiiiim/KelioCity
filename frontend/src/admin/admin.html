<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>KelioCity</title>
    <link rel="stylesheet" href="./admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://bossanova.uk/jspreadsheet/v4/jspreadsheet.js"></script>
    <link rel="stylesheet" href="https://bossanova.uk/jspreadsheet/v4/jspreadsheet.css" type="text/css" />
    <script src="https://jsuites.net/v5/jsuites.js"></script>
    <link rel="stylesheet" href="https://jsuites.net/v5/jsuites.css" type="text/css" />
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>Kelio<span>City</span></h1>
            <h2>Édition des bureaux</h2>
        </header>

        <section>
            <div class="file-actions">
                <label for="file-import" class="btn-secondary">Importer un fichier</label>
                <input type="file" id="file-import" accept=".ods, .xslx"/>

                <button id="file-export" class="btn-secondary" onclick="downloadSpreadsheet()">Télécharger le tableur</button>
            </div>
        </section>

        <div class="spreadsheet-wrapper">
            <div id="spreadsheet"></div>
        </div>

        <footer>
            <div class="controls">
                <label class="checkbox-container">
                    <input type="checkbox" id="reset"/>
                    <span class="checkmark"></span>
                    Réinitialiser la base de données
                </label>
                <button id="send" class="btn-primary" onclick="send()">Envoyer les données</button>
            </div>
        </footer>
    </div>

    <script type="module" src="./admin.js"></script>
</body>
</html>
