<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>KelioCity — Admin — Comptes</title>
  <link rel="stylesheet" href="../admin.css">
  <script>
    const token = sessionStorage.getItem("token");
    if (!token) window.location.href = "/src/auth/html/welcome.html";
  </script>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">Kelio<span>City</span></div>
        <div class="brand-sub">Espace admin</div>
      </div>

      <nav class="nav">
        <a class="btn btn-ghost active" href="/src/admin/pages/accounts.html">Comptes</a>
        <a class="btn btn-ghost" href="/src/admin/pages/database.html">Plan</a>
      </nav>

      <div class="actions">
        <span class="pill" id="role-pill">…</span>
        <button id="back-btn" class="btn btn-secondary">Retour au plan</button>
        <button id="logout-btn" class="btn btn-danger">Déconnexion</button>
      </div>
    </header>

    <div class="page-head">
      <div>
        <h1 class="page-title">Comptes</h1>
        <p class="page-subtitle">Suppression via <code>DELETE /api/employees/{id}</code>.</p>
      </div>
    </div>

    <section class="card">
      <div class="row">
        <input id="search" class="input" type="text" placeholder="Rechercher nom / prénom..." />
        <button id="refresh" class="btn btn-secondary">Rafraîchir</button>
      </div>
    </section>

    <section style="margin-top:12px;">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Status</th>
            <th>InOffice</th>
            <th>Desk</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7">Chargement…</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script type="module" src="./accounts.js"></script>
</body>
</html>
