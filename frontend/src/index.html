<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>KelioCity</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/sidebar.css">
    <link rel="stylesheet" href="./styles/menu.css">
    <link rel="icon" type="image/png" href="kelio.png">
    <!-- Check if authenticated otherwise redirect to welcome page -->
    <script>
      const token = sessionStorage.getItem("token");
      if (!token) {
        window.location.href = "/auth/html/welcome.html";
      }
    </script>
    <script type="module" src="./utils/searchbar.js"></script>
    <script type="module" src="./utils/selectFloor.js"></script>
  </head>
  <body>
    <div id="root-window">
      <div id="render-target"></div>

        <!-- Banner to choose a seat when registering -->
        <div id="register-banner" class="register-banner hidden">
          CHOISIS UN BUREAU OU UN SIEGE LIBRE
        </div>

        <!-- Filter buttons for search bar -->
        <div id="filter-wrapper" class="filter-wrapper">
          <button class="filter-btn" onclick="selectFilter(this)" data-type="employee">Employé</button>
          <button class="filter-btn" onclick="selectFilter(this)" data-type="room">Salle</button>
          <button class="filter-btn" onclick="selectFilter(this)" data-type="desk">Bureau</button>
        </div>

        <!-- Search bar -->
        <div id="search-wrapper" class="search-wrapper">
          <input type="text" class="search-bar" placeholder="Rechercher une personne, un bureau..."/>
          <button class="search-btn" aria-label="Rechercher" onclick="search()">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
          </button>
          <ul class="search-dropdown hidden">
          </ul>
        </div>

        <!-- Floor selector -->
        <div class="floor-wrapper">
          <select class="select-floor">
          </select>
        </div>

        <!-- Reset camera to a preset point -->
        <button id="reset-camera-btn" class="reset-btn">Reset Camera</button>

        <!-- Sidebar (hidden if no employee or room clicked -->
        <div id="sidebar" class="sidebar hidden">
          <h2>Informations</h2>
          <p>Clique sur un personnage pour afficher ses infos.</p>
        </div>

        <!-- Menu profile of the account (hidden if not clicked) -->
        <div id="menu" class="menu hidden"></div>

        <!-- Filter buttons to show availability or presences -->
        <button id="available-btn" class="available-btn"><img class="img-btn" src="/assets/icons/available.png" alt="icone disponible par Icons8"></button>
        <button id="occupied-btn" class="occupied-btn"><img class="img-btn" src="/assets/icons/occupied.png" alt="icone occupé par Icons8"></button>

        <!-- Button to zoom on ourself -->
        <button id="zoom-self-btn" class="zoom-self-btn" title="Zoom sur moi">
          <img src="/assets/icons/target.png" class="img-btn" alt="Zoom sur moi">
        </button>

        <!-- Button to open the menu profile -->
        <button id="menu-btn" class="menu-btn" aria-label="Ouvrir le menu">
          <img class="menu-icon" src="/assets/icons/menu.png" alt="">
        </button>

        <!-- Disconnect button and admin button (hidden if not admin) -->
        <button id="logout-btn" class="logout-btn">Déconnexion</button>
        <button id="admin-btn" class="admin-btn hidden">Admin</button>
      </div>
    <script type="module"> // module to start the floor creation and check for updates
      import { createScene } from './core/scene.jsx';
      import { startChangesWatcher } from "./utils/changesWatcher.js";
      function getModeFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const mode = (params.get("mode") || "").toUpperCase();
        return (mode === "LOGIN" || mode === "REGISTER") ? mode : "NORMAL";
      }
      window.onload = () => {
        window.floorId = 1;
        const mode = getModeFromUrl();
        window.scene = createScene(window.floorId, mode);
        window.scene.start();

        // check for changes each 2s
        startChangesWatcher(() => {
          window.scene.reload();
        }, { intervalMs: 2000 });
      };
    </script>
    <script type="module"> // module for disconnect button and open menu button
      import { openMenu } from "./utils/menu.js";
      const logoutBtn = document.getElementById("logout-btn");
      logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem("token");
        window.location.href = "/auth/html/welcome.html";
      });
      const menuBtn = document.getElementById("menu-btn");
      menuBtn.addEventListener("click", () => {
        openMenu();
      });
    </script>
    <script type="module"> // module to manage admin button
      import { apiFetch } from "./utils/apiFetch.js";
      const adminBtn = document.getElementById("admin-btn");

      async function loadMe() {
        try {
          const res = await apiFetch(`/api/me`, { method: "GET" });
          if (!res.ok) return;

          const me = await res.json();
          if (me.role === "ADMIN") {
            adminBtn.classList.remove("hidden");
          }
        } catch (e) {
          console.error("Erreur /api/me", e);
        }
      }

      adminBtn.addEventListener("click", () => {
        window.location.href = "/admin/admin.html";
      });

      loadMe();
    </script>
  </body>
</html>
