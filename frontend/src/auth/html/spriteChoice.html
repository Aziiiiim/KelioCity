<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KelioCity</title>
  <link rel="icon" type="image/png" href="../../kelio.png">
  <link rel="stylesheet" href="../css/spriteChoice.css" />
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Choisis ton avatar</h1>
    </header>

    <div class="scene-container">
      <div class="scene-wrap" data-scene="1">
        <canvas class="three"></canvas>
      </div>

      <div class="scene-wrap" data-scene="2">
        <canvas class="three"></canvas>
      </div>

      <div class="scene-wrap" data-scene="3">
        <canvas class="three"></canvas>
      </div>

      <div class="scene-wrap" data-scene="4">
        <canvas class="three"></canvas>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="btn-back">Retour</button>
      <button class="btn btn-primary" id="btn-create">Créer le compte</button>
    </div>
  </main>
</body>
<script type="module" src="../js/spriteChoice.js"></script>
</html>
