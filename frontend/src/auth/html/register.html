<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - KelioCity</title>
  <link rel="icon" type="image/png" href="../../kelio.png">
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>

  <main class="page">
    <a class="back" href="welcome.html">← Retour</a>

    <section class="card">
      <header class="head">
        <div class="logo">K</div>
        <div>
          <h2>Inscription</h2>
          <p>Créez votre compte KelioCity.</p>
        </div>
      </header>

      <form id="register-form" novalidate>
        <label>
          <span>Prénom(s)</span>
          <input type="text" id="firstName" placeholder="Prénom" required />
        </label>
        
        <label>
          <span>Nom</span>
          <input type="text" id="lastName" placeholder="Nom" required />
        </label>

        <label>
          <span>Email</span>
          <input type="email" id="email" placeholder="ex: nom@domaine.com" required />
        </label>

        <label>
          <span>Numéro de téléphone</span>
          <input type="tel" id="phoneNumber" placeholder="ex: 06 12 34 56 78" pattern="[0-9+ ]{10,15}" />
        </label>

        <label>
          <span>Mot de passe</span>
          <input type="password" id="password" placeholder="••••••••" required />
        </label>

        <button class="btn" type="submit">Créer un compte</button>
      </form>

      <p id="error" class="error" aria-live="polite"></p>

      <p class="switch">
        Déjà inscrit ? <a href="login.html">Se connecter</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/register.js"></script>
</body>
</html>
